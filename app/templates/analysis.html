<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Market Analysis — BTCFunk</title>
    <meta name="description" content="AI-generated Bitcoin market analysis covering price, technicals and on-chain data.">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #222; }
        nav { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 2rem; border-bottom: 1px solid #e5e7eb; background: #fff; }
        nav a { font-size: 0.8rem; color: #888; text-decoration: none; }
        nav a:hover { color: #111; }
        .logo { font-weight: 700; font-size: 0.95rem; color: #111; text-decoration: none; }
        .logo span { font-weight: 400; color: #aaa; margin-left: 0.4rem; font-size: 0.72rem; }
        main { max-width: 740px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
        .meta { font-size: 0.7rem; color: #aaa; margin-bottom: 2rem; }
        .analysis-body { font-size: 0.9rem; line-height: 1.8; color: #333; white-space: pre-wrap; }
        .analysis-body strong { color: #111; }
        #loading { color: #aaa; font-size: 0.85rem; margin-top: 3rem; text-align: center; }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="/">BTCFunk<span>Free Unchained Network Knowledge</span></a>
        <a href="/#dashboard" style="margin-left:auto">← Dashboard</a>
    </nav>
    <main>
        <div id="loading">Loading analysis…</div>
        <div id="content" style="display:none">
            <div class="meta" id="meta"></div>
            <div class="analysis-body" id="body"></div>
        </div>
    </main>
    <script>
        fetch('/api/analysis').then(r => r.json()).then(d => {
            if (!d.text) return;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('meta').textContent = d.generated_at
                ? 'Updated: ' + new Date(d.generated_at).toLocaleString('en-GB')
                : '';
            document.getElementById('body').textContent = d.text;
            document.getElementById('content').style.display = 'block';
        });
    </script>
</body>
</html>
