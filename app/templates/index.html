<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTCFunk — Bitcoin On-Chain Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f2; color: #111; display: flex; height: 100vh; overflow: hidden; font-size: 14px; }

        /* SIDEBAR */
        #sidebar {
            width: 200px; min-width: 200px;
            background: #fff; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; height: 100vh;
            transition: transform 0.25s ease;
            z-index: 100;
        }
        .logo { padding: 1.2rem 1rem; border-bottom: 1px solid #eee; }
        .logo h1 { font-size: 1rem; font-weight: 700; color: #111; letter-spacing: -0.02em; }
        .logo p  { font-size: 0.7rem; color: #888; margin-top: 0.15rem; }
        #search-wrap { padding: 0.75rem 1rem; border-bottom: 1px solid #eee; }
        #search {
            width: 100%; background: #f5f5f5; border: 1px solid #ddd;
            color: #111; padding: 0.4rem 0.6rem; font-size: 0.8rem;
            border-radius: 5px; outline: none; font-family: inherit;
        }
        #search:focus { border-color: #999; }
        #search::placeholder { color: #999; }
        #metric-list { overflow-y: auto; flex: 1; padding: 0.5rem 0; }
        .group-label { font-size: 0.65rem; color: #999; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.9rem 1rem 0.3rem; }
        .metric-item { padding: 0.5rem 1rem; font-size: 0.82rem; color: #333; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .metric-item:hover { background: #f7f7f7; color: #111; }
        .metric-item.active { color: #111; font-weight: 600; background: #f2f2f2; }
        .metric-item.soon { color: #bbb; cursor: default; pointer-events: none; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
        .metric-item.active .dot { background: #111; }

        /* HAMBURGER */
        #hamburger {
            display: none; position: fixed; top: 0.75rem; left: 0.75rem; z-index: 200;
            background: #fff; border: 1px solid #ddd; border-radius: 6px;
            width: 34px; height: 34px; cursor: pointer; font-size: 1rem;
            align-items: center; justify-content: center; color: #444;
        }

        /* OVERLAY */
        #overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.25); z-index: 99;
        }
        #overlay.open { display: block; }

        /* MAIN */
        #main { flex: 1; overflow-y: auto; padding: 1.5rem; }

        /* HOME GRID — 3 colonne desktop */
        #view-home { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

        /* Tablet */
        @media (max-width: 1100px) {
            #view-home { grid-template-columns: 1fr 1fr; }
        }

        /* Mobile */
        @media (max-width: 640px) {
            #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #hamburger { display: flex; }
            #main { padding: 1rem; padding-top: 3.5rem; }
            #view-home { grid-template-columns: 1fr; }
        }
        .home-card {
            background: #fff; border: 1px solid #ddd; border-radius: 8px;
            padding: 1.2rem; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
            display: flex; flex-direction: column;
        }
        .home-card:hover { border-color: #999; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .home-card.soon { cursor: default; opacity: 0.35; }
        .home-card.soon:hover { border-color: #ddd; box-shadow: none; }
        .home-card[draggable]:not(.soon) { cursor: grab; }
        .home-card.dragging { opacity: 0.35; cursor: grabbing; }
        .home-card.drag-over { border-color: #111; box-shadow: 0 0 0 2px #111; }
        .hc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.5rem; }
        .hc-label { font-size: 0.78rem; color: #111; font-weight: 600; letter-spacing: -0.01em; }
        .hc-acronym { font-size: 0.68rem; color: #888; margin-top: 0.15rem; }
        .hc-value { font-size: 2rem; font-weight: 700; color: #111; line-height: 1; margin-bottom: 0.4rem; }
        .hc-value.loading { font-size: 1rem; color: #ccc; font-weight: 400; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; }
        .ok      { background: #f0faf4; color: #16a34a; }
        .ko      { background: #fef2f2; color: #dc2626; }
        .medium  { background: #fff7ed; color: #ea580c; }
        .neutral { background: #f5f5f5; color: #777; }
        .hc-chart { flex: 1; min-height: 120px; margin-top: 0.8rem; position: relative; }
        .hc-loader {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        }
        .spinner {
            width: 20px; height: 20px; border: 2px solid #eee;
            border-top-color: #bbb; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* DETAIL VIEW */
        #view-detail { display: none; }
        .detail-back { font-size: 0.8rem; color: #888; cursor: pointer; margin-bottom: 1.2rem; display: inline-flex; align-items: center; gap: 0.3rem; }
        .detail-back:hover { color: #111; }
        .detail-api  { font-size: 0.72rem; color: #888; text-decoration: none; float: right; margin-top: 0.1rem; }
        .detail-api:hover { color: #111; }
        .detail-title   { font-size: 1.1rem; font-weight: 700; color: #111; margin-bottom: 0.15rem; }
        .detail-acronym { font-size: 0.78rem; color: #888; margin-bottom: 1.5rem; }
        .detail-text    { font-size: 0.8rem; color: #666; line-height: 1.65; margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid #eee; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .metric-row { display: flex; gap: 2.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .stat .val  { font-size: 1.6rem; font-weight: 700; color: #111; }
        .stat .lbl  { font-size: 0.7rem; color: #888; margin-top: 0.15rem; }
        .hint { font-size: 0.75rem; color: #999; margin-bottom: 1rem; }
        .updated { font-size: 0.68rem; color: #ccc; margin-top: 1rem; }
    </style>
</head>
<body>

<button id="hamburger">☰</button>
<div id="overlay"></div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="logo">
        <h1>BTCFunk</h1>
        <p>Bitcoin On-Chain Analytics</p>
    </div>
    <div id="search-wrap">
        <input id="search" type="text" placeholder="Search...">
    </div>
    <div id="metric-list"></div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- HOME (popolato da JS) -->
    <div id="view-home"></div>

    <!-- DETAIL -->
    <div id="view-detail">
        <div class="detail-back" id="btn-back">← Home</div>
        <a class="detail-api" id="detail-api-link" href="#" target="_blank"></a>
        <div class="detail-title"   id="detail-title"></div>
        <div class="detail-acronym" id="detail-acronym"></div>

        <div id="detail-panels"></div>
    </div>

</div>

<script>
    const METRICS = {
        mvrv: {
            label: 'MVRV Ratio', acronym: 'Market Value / Realized Value', live: true, group: 'Market',
            detail: 'MVRV compares the current market capitalization to the Realized Cap — the sum of all UTXOs valued at the price when they last moved. Values below 1 indicate the market is trading below the aggregate cost basis of holders, historically a strong accumulation zone. Values above 3.5 have consistently coincided with cycle tops. MVRV is a macro cycle indicator, not a short-term trading signal.',
            stats: [
                { id: 'val',   label: 'MVRV' },
                { id: 'price', label: 'BTC Price',    small: true },
                { id: 'mcap',  label: 'Market Cap',   small: true },
                { id: 'rcap',  label: 'Realized Cap', small: true },
            ],
            hint: '&lt;1 undervalued &nbsp;|&nbsp; 1–2 fair value &nbsp;|&nbsp; 2–3.5 caution &nbsp;|&nbsp; &gt;3.5 top zone',
            chartHeight: 220,
        },
        sopr: {
            label: 'SOPR', acronym: 'Spent Output Profit Ratio', live: true, group: 'Profitability',
            detail: 'SOPR measures whether coins moved on a given day were sold at a profit or a loss relative to their acquisition price. A value above 1 means that on average, coins were moved at a gain. Values below 1 signal selling at a loss — often a sign of capitulation or an accumulation phase. A recovery of SOPR back above 1 after a sustained period below is considered a bullish signal.',
            stats: [{ id: 'val', label: 'SOPR (today)' }],
            hint: '&lt;1 selling at loss &nbsp;|&nbsp; =1 breakeven &nbsp;|&nbsp; &gt;1 selling at profit',
            chartHeight: 220,
        },
        nvt: {
            label: 'NVT Ratio', acronym: 'Network Value to Transactions', live: true, group: 'Market',
            detail: 'NVT compares Bitcoin\'s market cap to its on-chain transaction volume (28-day moving average). It works like a P/E ratio for Bitcoin: a high NVT means the network is valued far above its actual usage, historically a sign of overvaluation. A low NVT signals strong utility relative to price — a potential buy zone.',
            stats: [{ id: 'val', label: 'NVT (28d MA)' }],
            hint: '&lt;50 undervalued &nbsp;|&nbsp; 50–100 fair &nbsp;|&nbsp; 100–150 caution &nbsp;|&nbsp; &gt;150 overvalued',
            chartHeight: 220,
        },
        hodl: {
            label: 'HODL Waves', acronym: 'Age distribution of BTC supply', live: true, group: 'Supply',
            detail: 'HODL Waves show what percentage of Bitcoin supply has not moved within each time band. A rising Long-Term Holder (LTH) share — coins unmoved for over 1 year — signals conviction and supply contraction. Distribution phases are visible when old coins start moving, reducing the LTH percentage.',
            stats: [
                { id: 'lth', label: 'LTH (&gt; 1 year)' },
                { id: 'sth', label: 'STH (&lt; 1 year)' },
            ],
            hint: 'LTH &gt; 70% strong accumulation &nbsp;|&nbsp; LTH &lt; 50% distribution phase',
            chartHeight: 320,
            chartType: 'hodl',
        },
        cdd: {
            label: 'CDD', acronym: 'Coin Days Destroyed', live: true, group: 'Supply',
            detail: 'Coin Days Destroyed weights each BTC transaction by how long the coins sat idle before moving. One coin held for 100 days and then spent destroys 100 coin-days. A spike in CDD means old, long-dormant coins are being moved — often a sign of large holders distributing near market tops.',
            stats: [
                { id: 'val', label: 'CDD (today)' },
                { id: 'ma',  label: '90d Average' },
            ],
            hint: 'Spike above 2&times; 90d avg signals old coins moving — potential distribution',
            chartHeight: 220,
        },
        exchange_flow: {
            label: 'Exchange Flows', acronym: 'BTC inflows & outflows to exchanges', live: true, group: 'Flows',
            detail: 'Exchange Flow tracks Bitcoin moving into and out of known exchange wallets (761 labeled addresses across 50+ exchanges, sourced from Dune Analytics). Net inflow — more BTC entering exchanges — is historically bearish, as coins are often deposited to be sold. Net outflow — BTC leaving exchanges — suggests accumulation and reduced sell pressure.',
            stats: [
                { id: 'inflow',  label: 'Inflow (today)' },
                { id: 'outflow', label: 'Outflow (today)' },
                { id: 'net',     label: 'Net Flow' },
            ],
            hint: 'Net &gt; 0 (more inflow) bearish — BTC entering exchanges &nbsp;|&nbsp; Net &lt; 0 bullish — accumulation',
            chartHeight: 220,
            extra: 'top',
        },
        nupl: {
            label: 'NUPL', acronym: 'Net Unrealized Profit / Loss', live: true, group: 'Profitability',
            detail: 'NUPL measures the aggregate unrealized profit or loss of all Bitcoin holders. It is derived directly from MVRV: NUPL = 1 – 1/MVRV. Values below 0 indicate the market is in capitulation — holders are collectively at a loss, historically a strong buy zone. Values above 0.75 signal euphoria, where most supply is in heavy profit and a reversal is likely.',
            stats: [
                { id: 'val', label: 'NUPL' },
                { id: 'rp',  label: 'Realized Price', small: true },
            ],
            hint: '&lt;0 capitulation &nbsp;|&nbsp; 0–0.25 hope &nbsp;|&nbsp; 0.25–0.5 optimism &nbsp;|&nbsp; 0.5–0.75 belief &nbsp;|&nbsp; &gt;0.75 euphoria',
            chartHeight: 220,
        },
        rhodl: {
            label: 'RHODL Ratio', acronym: 'Ratio HODLed 1–2y vs 1d–1w supply', live: true, group: 'Supply',
            detail: 'The RHODL Ratio compares the BTC held for 1–2 years to the BTC held for just 1 day–1 week. A high ratio means long-term holders dominate supply — bullish conviction. A low ratio means recent buyers dominate — typical of early bear markets when LTH have distributed and new buyers have not yet accumulated. It signals cycle phases without relying on price.',
            stats: [{ id: 'val', label: 'RHODL Ratio' }],
            hint: 'High ratio: LTH conviction &nbsp;|&nbsp; Low ratio: STH dominant — early bear or opportunity',
            chartHeight: 320,
            chartType: 'hodl_profit',
        },
        supply_profit: {
            label: 'Supply in Profit', acronym: '% of BTC supply in unrealized profit', live: true, group: 'Profitability',
            detail: 'Supply in Profit measures what percentage of the circulating Bitcoin supply has an acquisition price below the current market price — meaning those coins are currently sitting on an unrealized gain. When nearly all supply is in profit (>90%) the market is historically near cycle tops. When supply in profit falls below 50%, it signals widespread capitulation and potential accumulation zones.',
            stats: [{ id: 'val', label: '% in Profit' }],
            hint: '&gt;90% euphoria / top zone &nbsp;|&nbsp; 50–75% fair &nbsp;|&nbsp; &lt;50% capitulation / buy zone',
            chartHeight: 320,
            chartType: 'hodl_profit',
        },
        puell: {
            label: 'Puell Multiple', acronym: 'Daily miner revenue vs 365d average', live: true, group: 'Mining',
            detail: 'The Puell Multiple divides the current daily miner revenue (block rewards + fees) by its 365-day moving average. Miners are systematic sellers — when revenue is unusually high relative to the historical average, they tend to sell more, creating downward price pressure. Values below 0.5 historically coincide with market bottoms; values above 4 with cycle tops.',
            stats: [
                { id: 'val',     label: 'Puell Multiple' },
                { id: 'revenue', label: 'Daily Revenue',  small: true },
            ],
            hint: '&lt;0.5 bottom zone &nbsp;|&nbsp; 0.5–2 fair &nbsp;|&nbsp; 2–4 caution &nbsp;|&nbsp; &gt;4 top zone',
            chartHeight: 220,
        },
        active_addresses: {
            label: 'Active Addresses', acronym: 'Unique addresses transacting per day', live: true, group: 'Network',
            detail: 'Active Addresses counts the number of unique Bitcoin addresses that participated in a transaction on a given day (receiving side). Rising active addresses signal growing network adoption and user activity. A divergence between rising price and falling active addresses can be a warning sign — price moves not supported by underlying on-chain activity often reverse.',
            stats: [
                { id: 'val', label: 'Active today' },
                { id: 'ma',  label: '30d Average', small: true },
            ],
            hint: 'Rising addresses = growing adoption &nbsp;|&nbsp; Divergence from price = warning signal',
            chartHeight: 220,
        },
        whale_tx: {
            label: 'Whale Transactions', acronym: 'Transactions > 100 BTC per day', live: true, group: 'Network',
            detail: 'Whale Transactions counts the number of on-chain Bitcoin transactions moving more than 100 BTC (~$10M+) per day. A spike in whale activity often precedes significant price moves — large holders repositioning, OTC settlements, or exchange deposits ahead of selling. Sustained high whale transaction volume alongside rising exchange inflows is a classic distribution signal.',
            stats: [
                { id: 'val', label: 'Count (today)' },
                { id: 'vol', label: 'Volume (BTC)',  small: true },
            ],
            hint: 'Spike + rising exchange inflow = distribution risk &nbsp;|&nbsp; Spike + outflow = accumulation',
            chartHeight: 220,
        },
    };

    let data = { mvrv: null, sopr: null, nvt: null, hodl: null, cdd: null, exchange_flow: null, nupl: null, rhodl: null, supply_profit: null, puell: null, active_addresses: null, whale_tx: null };
    let charts = {};
    let dragSrc = null;

    function makeCard(id) {
        const m = METRICS[id];
        if (!m.live) return `
            <div class="home-card soon" data-id="${id}" draggable="true">
                <div class="hc-label">${m.label}</div>
                <div class="hc-acronym">${m.acronym}</div>
                <div class="hc-value" style="font-size:1rem;color:#ccc;margin-top:0.5rem">coming soon</div>
            </div>`;
        return `
            <div class="home-card" data-id="${id}" id="hc-${id}-card" draggable="true" style="pointer-events:none">
                <div class="hc-top">
                    <div>
                        <div class="hc-label">${m.label}</div>
                        <div class="hc-acronym">${m.acronym}</div>
                    </div>
                    <span class="badge neutral" id="hc-${id}-badge">—</span>
                </div>
                <div class="hc-value loading" id="hc-${id}-val">—</div>
                <div class="hc-chart">
                    <div class="hc-loader" id="hc-${id}-loader"><div class="spinner"></div></div>
                    <canvas id="hc-${id}-chart" style="display:none"></canvas>
                </div>
            </div>`;
    }

    function makeDetailPanel(id) {
        const m = METRICS[id];
        const statsHtml = (m.stats || []).map(s =>
            `<div class="stat">
                <div class="val" id="d-${id}-${s.id}"${s.small ? ' style="font-size:1.1rem"' : ''}>—</div>
                <div class="lbl">${s.label}</div>
            </div>`
        ).join('');
        const h = m.chartHeight || 220;
        return `
            <div id="detail-${id}" style="display:none">
                <div class="card">
                    <div class="metric-row">${statsHtml}</div>
                    <div class="hint">${m.hint || ''}</div>
                    <canvas id="${id}-chart-detail" style="max-height:${h}px; margin-top:1rem"></canvas>
                    ${m.extra === 'top' ? `<div id="d-${id}-extra" style="margin-top:1rem"></div>` : ''}
                    <div class="updated" id="d-${id}-updated"></div>
                    <div class="detail-text" id="d-${id}-text"></div>
                </div>
            </div>`;
    }

    function buildDetailPanels() {
        document.getElementById('detail-panels').innerHTML =
            Object.keys(METRICS).map(makeDetailPanel).join('');
    }
    buildDetailPanels();

    function saveWidgetOrder() {
        const order = [...document.querySelectorAll('#view-home .home-card')].map(c => c.dataset.id);
        localStorage.setItem('btcfunk-widget-order', JSON.stringify(order));
    }

    function loadWidgetOrder() {
        try { return JSON.parse(localStorage.getItem('btcfunk-widget-order')); } catch { return null; }
    }

    function initDragDrop() {
        const grid = document.getElementById('view-home');
        grid.querySelectorAll('.home-card').forEach(card => {
            card.addEventListener('dragstart', e => {
                dragSrc = card;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                grid.querySelectorAll('.home-card').forEach(c => c.classList.remove('drag-over'));
                saveWidgetOrder();
            });
            card.addEventListener('dragover', e => {
                e.preventDefault();
                if (card !== dragSrc) {
                    grid.querySelectorAll('.home-card').forEach(c => c.classList.remove('drag-over'));
                    card.classList.add('drag-over');
                }
            });
            card.addEventListener('drop', e => {
                e.preventDefault();
                if (dragSrc && dragSrc !== card) {
                    const all = [...grid.querySelectorAll('.home-card')];
                    all.indexOf(dragSrc) < all.indexOf(card)
                        ? grid.insertBefore(dragSrc, card.nextSibling)
                        : grid.insertBefore(dragSrc, card);
                }
                card.classList.remove('drag-over');
            });
        });
    }

    function buildHomeCards() {
        const saved = loadWidgetOrder();
        const keys = saved ? [...new Set([...saved, ...Object.keys(METRICS)].filter(k => METRICS[k]))] : Object.keys(METRICS);
        document.getElementById('view-home').innerHTML = keys.map(makeCard).join('');
        document.querySelectorAll('.home-card:not(.soon)').forEach(el =>
            el.addEventListener('click', () => showDetail(el.dataset.id)));
        initDragDrop();
    }
    buildHomeCards();

    function buildSidebar() {
        const groups = {};
        Object.entries(METRICS).forEach(([id, m]) => {
            if (!groups[m.group]) groups[m.group] = [];
            groups[m.group].push({ id, ...m });
        });
        const list = document.getElementById('metric-list');
        list.innerHTML = Object.entries(groups).map(([group, items]) => `
            <div class="group-label">${group}</div>
            ${items.map(m => `
                <div class="metric-item${m.live ? '' : ' soon'}" data-id="${m.id}">
                    <span class="dot"></span>${m.label}
                </div>`).join('')}
        `).join('');
        document.querySelectorAll('.metric-item:not(.soon)').forEach(el =>
            el.addEventListener('click', () => showDetail(el.dataset.id)));
    }
    buildSidebar();

    function cardChart(id, labels, values, color, small) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id);
        if (!ctx) return;
        const ticks = small ? { color: '#999', maxTicksLimit: 4, font: { size: 10 } } : { color: '#999', maxTicksLimit: 8, font: { size: 11 } };
        charts[id] = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ data: values, borderColor: color, borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.2 }] },
            options: {
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { ...ticks, maxRotation: 0 }, grid: { color: '#f0f0f0' } },
                    y: { ticks, grid: { color: '#f0f0f0' } }
                }
            }
        });
    }

    function fmt_usd(n) {
        if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
        if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
        return '$' + n.toLocaleString();
    }

    function mvrv_signal(v) {
        if (v < 1)   return { label: 'UNDERVALUED', cls: 'ok' };
        if (v < 2)   return { label: 'FAIR VALUE',  cls: 'neutral' };
        if (v < 3.5) return { label: 'CAUTION',     cls: 'medium' };
        return           { label: 'TOP ZONE',    cls: 'ko' };
    }

    function sopr_signal(v) {
        if (!v || v < 1)    return { label: 'LOSS',      cls: 'ko' };
        if (v < 1.02)       return { label: 'BREAKEVEN', cls: 'neutral' };
        return                  { label: 'PROFIT',   cls: 'ok' };
    }

    function nvt_signal(v) {
        if (!v)       return { label: '—',           cls: 'neutral' };
        if (v < 50)   return { label: 'UNDERVALUED', cls: 'ok' };
        if (v < 100)  return { label: 'FAIR VALUE',  cls: 'neutral' };
        if (v < 150)  return { label: 'CAUTION',     cls: 'medium' };
        return            { label: 'OVERVALUED',  cls: 'ko' };
    }

    function hodl_signal(lth) {
        if (!lth)      return { label: '—',           cls: 'neutral' };
        if (lth > 70)  return { label: 'STRONG HODL', cls: 'ok' };
        if (lth > 60)  return { label: 'HODL',        cls: 'neutral' };
        if (lth > 50)  return { label: 'MIXED',       cls: 'medium' };
        return             { label: 'DISTRIBUTION', cls: 'ko' };
    }

    function nupl_signal(v) {
        if (v === null || v === undefined) return { label: '—', cls: 'neutral' };
        if (v < 0)    return { label: 'CAPITULATION', cls: 'ok' };
        if (v < 0.25) return { label: 'HOPE',         cls: 'ok' };
        if (v < 0.5)  return { label: 'OPTIMISM',     cls: 'neutral' };
        if (v < 0.75) return { label: 'BELIEF',       cls: 'medium' };
        return             { label: 'EUPHORIA',    cls: 'ko' };
    }

    function supply_profit_signal(pct) {
        if (!pct) return { label: '—', cls: 'neutral' };
        if (pct > 90) return { label: 'TOP ZONE',    cls: 'ko' };
        if (pct > 75) return { label: 'BULL MARKET', cls: 'medium' };
        if (pct > 50) return { label: 'RECOVERY',    cls: 'neutral' };
        return            { label: 'BUY ZONE',    cls: 'ok' };
    }

    function rhodl_signal(v) {
        if (!v) return { label: '—', cls: 'neutral' };
        if (v > 50)  return { label: 'EUPHORIA',    cls: 'ko' };
        if (v > 10)  return { label: 'BULL',        cls: 'medium' };
        if (v > 2)   return { label: 'ACCUMULATE',  cls: 'neutral' };
        return           { label: 'STH DOMINANT', cls: 'ok' };
    }

    function puell_signal(v) {
        if (!v) return { label: '—', cls: 'neutral' };
        if (v < 0.5) return { label: 'BOTTOM ZONE', cls: 'ok' };
        if (v < 2.0) return { label: 'FAIR',        cls: 'neutral' };
        if (v < 4.0) return { label: 'CAUTION',     cls: 'medium' };
        return           { label: 'TOP ZONE',    cls: 'ko' };
    }

    function active_signal(current, ma30) {
        if (!current || !ma30) return { label: '—', cls: 'neutral' };
        const r = current / ma30;
        if (r > 1.3)  return { label: 'SURGE',   cls: 'medium' };
        if (r > 0.85) return { label: 'NORMAL',  cls: 'neutral' };
        return            { label: 'LOW',     cls: 'neutral' };
    }

    function whale_signal(current, ma30) {
        if (!current || !ma30) return { label: '—', cls: 'neutral' };
        const r = current / ma30;
        if (r > 2)   return { label: 'SPIKE',    cls: 'medium' };
        if (r > 1.3) return { label: 'ELEVATED', cls: 'neutral' };
        return           { label: 'NORMAL',   cls: 'neutral' };
    }

    function fmt_addr(n) {
        if (!n) return '—';
        if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
        return n.toLocaleString();
    }

    function ef_signal(net) {
        if (net === null || net === undefined) return { label: '—', cls: 'neutral' };
        if (net > 5000)  return { label: 'SELL PRESSURE', cls: 'ko' };
        if (net > 0)     return { label: 'INFLOW',        cls: 'medium' };
        if (net > -5000) return { label: 'OUTFLOW',       cls: 'ok' };
        return               { label: 'STRONG OUT',   cls: 'ok' };
    }

    function fmt_btc(n) {
        if (!n && n !== 0) return '—';
        if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2) + 'M BTC';
        if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K BTC';
        return n.toFixed(0) + ' BTC';
    }

    function cdd_signal(cdd, ma90) {
        if (!cdd || !ma90) return { label: '—', cls: 'neutral' };
        const ratio = cdd / ma90;
        if (ratio < 0.5)  return { label: 'LOW',      cls: 'ok' };
        if (ratio < 1.5)  return { label: 'NORMAL',   cls: 'neutral' };
        if (ratio < 2.5)  return { label: 'ELEVATED', cls: 'medium' };
        return                { label: 'SPIKE',     cls: 'ko' };
    }

    function fmt_cdd(n) {
        if (!n) return '—';
        if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
        if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
        return n.toLocaleString();
    }

    function sigColor(cls) {
        if (cls === 'ok')     return '#16a34a';
        if (cls === 'ko')     return '#dc2626';
        if (cls === 'medium') return '#ea580c';
        return '#555';
    }

    function renderHodlChart(id, bands, small) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id);
        if (!ctx) return;
        const labels = bands.map(b => b.label);
        const values = bands.map(b => b.pct);
        const colors = bands.map((b, i) => {
            const age = ['< 1 day','1d – 1w','1w – 1m','1m – 3m','3m – 6m','6m – 1y'].includes(b.label);
            return age ? '#e5e7eb' : `hsl(${210 + i * 10}, 60%, ${55 - i * 2}%)`;
        });
        charts[id] = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
            options: {
                indexAxis: 'y',
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#999', font: { size: small ? 9 : 11 }, callback: v => v + '%' }, grid: { color: '#f0f0f0' } },
                    y: { ticks: { color: '#888', font: { size: small ? 9 : 11 } }, grid: { display: false } }
                }
            }
        });
    }

    function renderProfitChart(canvasId, bandsProfit, small) {
        if (charts[canvasId]) charts[canvasId].destroy();
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;
        const labels = bandsProfit.map(b => b.label);
        const values = bandsProfit.map(b => b.pct);
        const colors = bandsProfit.map(b => b.in_profit ? 'rgba(22,163,74,0.7)' : 'rgba(220,38,38,0.6)');
        charts[canvasId] = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
            options: {
                indexAxis: 'y', animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#999', font: { size: small ? 9 : 11 }, callback: v => v + '%' }, grid: { color: '#f0f0f0' } },
                    y: { ticks: { color: '#888', font: { size: small ? 9 : 11 } }, grid: { display: false } }
                }
            }
        });
    }

    function cardReady(id) {
        document.getElementById('hc-' + id + '-loader').style.display = 'none';
        document.getElementById('hc-' + id + '-chart').style.display = 'block';
        document.getElementById('hc-' + id + '-card').style.pointerEvents = '';
        document.getElementById('hc-' + id + '-val').classList.remove('loading');
    }

    // Load MVRV
    fetch('/api/mvrv').then(r => r.json()).then(d => {
        data.mvrv = d;
        const sig = mvrv_signal(d.mvrv);
        const hv = document.getElementById('hc-mvrv-val');
        hv.textContent = d.mvrv.toFixed(2);
        const hb = document.getElementById('hc-mvrv-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-mvrv-val').textContent   = d.mvrv.toFixed(2);
        document.getElementById('d-mvrv-price').textContent = fmt_usd(d.current_price);
        document.getElementById('d-mvrv-mcap').textContent  = fmt_usd(d.market_cap);
        document.getElementById('d-mvrv-rcap').textContent  = fmt_usd(d.realized_cap);
        document.getElementById('d-mvrv-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-mvrv-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('mvrv');
    }).catch(() => {
        document.getElementById('hc-mvrv-val').textContent = 'error';
        cardReady('mvrv');
    });

    // Load SOPR
    fetch('/api/sopr').then(r => r.json()).then(d => {
        data.sopr = d;
        const sig = sopr_signal(d.current);
        const hv = document.getElementById('hc-sopr-val');
        hv.textContent = d.current ? d.current.toFixed(3) : '—';
        const hb = document.getElementById('hc-sopr-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-sopr-val').textContent = d.current ? d.current.toFixed(3) : '—';
        document.getElementById('d-sopr-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-sopr-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('sopr');
    }).catch(() => {
        document.getElementById('hc-sopr-val').textContent = 'error';
        cardReady('sopr');
    });

    // Load NVT
    fetch('/api/nvt').then(r => r.json()).then(d => {
        data.nvt = d;
        const sig = nvt_signal(d.nvt);
        document.getElementById('hc-nvt-val').textContent = d.nvt ? d.nvt.toFixed(1) : '—';
        const hb = document.getElementById('hc-nvt-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-nvt-val').textContent = d.nvt ? d.nvt.toFixed(1) : '—';
        document.getElementById('d-nvt-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-nvt-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('nvt');
    }).catch(() => { document.getElementById('hc-nvt-val').textContent = 'error'; cardReady('nvt'); });

    // Load HODL
    fetch('/api/hodl').then(r => r.json()).then(d => {
        data.hodl = d;
        const sig = hodl_signal(d.lth_pct);
        document.getElementById('hc-hodl-val').textContent = d.lth_pct ? d.lth_pct.toFixed(1) + '%' : '—';
        const hb = document.getElementById('hc-hodl-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-hodl-lth').textContent = d.lth_pct ? d.lth_pct.toFixed(1) + '%' : '—';
        document.getElementById('d-hodl-sth').textContent = d.sth_pct ? d.sth_pct.toFixed(1) + '%' : '—';
        document.getElementById('d-hodl-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        renderHodlChart('hc-hodl-chart', d.bands, true);
        cardReady('hodl');
    }).catch(() => { document.getElementById('hc-hodl-val').textContent = 'error'; cardReady('hodl'); });

    // Load Exchange Flow
    fetch('/api/exchange_flow').then(r => r.json()).then(d => {
        data.exchange_flow = d;
        const sig = ef_signal(d.current_net);
        document.getElementById('hc-exchange_flow-val').textContent = fmt_btc(d.current_net);
        const hb = document.getElementById('hc-exchange_flow-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-exchange_flow-inflow').textContent  = fmt_btc(d.current_inflow);
        document.getElementById('d-exchange_flow-outflow').textContent = fmt_btc(d.current_outflow);
        document.getElementById('d-exchange_flow-net').textContent     = fmt_btc(d.current_net);
        document.getElementById('d-exchange_flow-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB') + ' · ' + d.address_count + ' addresses';
        cardChart('hc-exchange_flow-chart', d.labels, d.net, sigColor(sig.cls), true);
        cardReady('exchange_flow');
    }).catch(() => { document.getElementById('hc-exchange_flow-val').textContent = 'error'; cardReady('exchange_flow'); });

    // Load CDD
    fetch('/api/cdd').then(r => r.json()).then(d => {
        data.cdd = d;
        const sig = cdd_signal(d.current, d.ma90);
        document.getElementById('hc-cdd-val').textContent = fmt_cdd(d.current);
        const hb = document.getElementById('hc-cdd-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-cdd-val').textContent = fmt_cdd(d.current);
        document.getElementById('d-cdd-ma').textContent  = fmt_cdd(d.ma90);
        document.getElementById('d-cdd-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-cdd-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('cdd');
    }).catch(() => { document.getElementById('hc-cdd-val').textContent = 'error'; cardReady('cdd'); });

    // Load NUPL
    fetch('/api/nupl').then(r => r.json()).then(d => {
        data.nupl = d;
        const sig = nupl_signal(d.nupl);
        document.getElementById('hc-nupl-val').textContent = d.nupl !== null ? d.nupl.toFixed(3) : '—';
        const hb = document.getElementById('hc-nupl-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-nupl-val').textContent = d.nupl !== null ? d.nupl.toFixed(3) : '—';
        document.getElementById('d-nupl-rp').textContent  = d.realized_price ? fmt_usd(d.realized_price) : '—';
        document.getElementById('d-nupl-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-nupl-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('nupl');
    }).catch(() => { document.getElementById('hc-nupl-val').textContent = 'error'; cardReady('nupl'); });

    // Load RHODL + Supply in Profit
    fetch('/api/rhodl').then(r => r.json()).then(d => {
        data.rhodl = d;
        data.supply_profit = d;
        // RHODL card
        const sigR = rhodl_signal(d.rhodl);
        document.getElementById('hc-rhodl-val').textContent = d.rhodl !== null ? d.rhodl.toLocaleString() : '—';
        const hbR = document.getElementById('hc-rhodl-badge');
        hbR.textContent = sigR.label; hbR.className = 'badge ' + sigR.cls;
        document.getElementById('d-rhodl-val').textContent = d.rhodl !== null ? d.rhodl.toLocaleString() : '—';
        document.getElementById('d-rhodl-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        if (d.bands_profit) renderProfitChart('hc-rhodl-chart', d.bands_profit, true);
        cardReady('rhodl');
        // Supply in Profit card
        const pct = d.supply_in_profit_pct;
        const sigP = supply_profit_signal(pct);
        document.getElementById('hc-supply_profit-val').textContent = pct !== null ? pct.toFixed(1) + '%' : '—';
        const hbP = document.getElementById('hc-supply_profit-badge');
        hbP.textContent = sigP.label; hbP.className = 'badge ' + sigP.cls;
        document.getElementById('d-supply_profit-val').textContent = pct !== null ? pct.toFixed(1) + '%' : '—';
        document.getElementById('d-supply_profit-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        if (d.bands_profit) renderProfitChart('hc-supply_profit-chart', d.bands_profit, true);
        cardReady('supply_profit');
    }).catch(() => {
        document.getElementById('hc-rhodl-val').textContent = 'error'; cardReady('rhodl');
        document.getElementById('hc-supply_profit-val').textContent = 'error'; cardReady('supply_profit');
    });

    // Load Puell Multiple
    fetch('/api/puell').then(r => r.json()).then(d => {
        data.puell = d;
        const sig = puell_signal(d.puell);
        document.getElementById('hc-puell-val').textContent = d.puell !== null ? d.puell.toFixed(2) : '—';
        const hb = document.getElementById('hc-puell-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-puell-val').textContent     = d.puell !== null ? d.puell.toFixed(2) : '—';
        document.getElementById('d-puell-revenue').textContent = d.daily_revenue ? fmt_btc(d.daily_revenue) : '—';
        document.getElementById('d-puell-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-puell-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('puell');
    }).catch(() => { document.getElementById('hc-puell-val').textContent = 'error'; cardReady('puell'); });

    // Load Active Addresses
    fetch('/api/active_addresses').then(r => r.json()).then(d => {
        data.active_addresses = d;
        const sig = active_signal(d.current, d.ma30);
        document.getElementById('hc-active_addresses-val').textContent = fmt_addr(d.current);
        const hb = document.getElementById('hc-active_addresses-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-active_addresses-val').textContent = fmt_addr(d.current);
        document.getElementById('d-active_addresses-ma').textContent  = fmt_addr(d.ma30);
        document.getElementById('d-active_addresses-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB');
        cardChart('hc-active_addresses-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('active_addresses');
    }).catch(() => { document.getElementById('hc-active_addresses-val').textContent = 'error'; cardReady('active_addresses'); });

    // Load Whale Transactions
    fetch('/api/whale_tx').then(r => r.json()).then(d => {
        data.whale_tx = d;
        const sig = whale_signal(d.current, d.ma30);
        document.getElementById('hc-whale_tx-val').textContent = d.current !== null ? d.current.toLocaleString() : '—';
        const hb = document.getElementById('hc-whale_tx-badge');
        hb.textContent = sig.label; hb.className = 'badge ' + sig.cls;
        document.getElementById('d-whale_tx-val').textContent = d.current !== null ? d.current.toLocaleString() : '—';
        document.getElementById('d-whale_tx-vol').textContent = d.current_volume ? fmt_btc(d.current_volume) : '—';
        document.getElementById('d-whale_tx-updated').textContent = 'Updated: ' + new Date(d.updated_at).toLocaleString('en-GB') + ' · >' + d.threshold_btc + ' BTC threshold';
        cardChart('hc-whale_tx-chart', d.labels, d.values, sigColor(sig.cls), true);
        cardReady('whale_tx');
    }).catch(() => { document.getElementById('hc-whale_tx-val').textContent = 'error'; cardReady('whale_tx'); });

    // Navigation
    function showHome() {
        document.getElementById('view-home').style.display = 'grid';
        document.getElementById('view-detail').style.display = 'none';
        document.querySelectorAll('.metric-item').forEach(el => {
            el.classList.toggle('active', ['mvrv','sopr'].includes(el.dataset.id));
        });
    }

    function showDetail(id) {
        if (!METRICS[id]) return;
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('detail-title').textContent   = METRICS[id].label;
        document.getElementById('detail-acronym').textContent = METRICS[id].acronym;
        document.getElementById('detail-api-link').href = '/api/' + id;
        document.getElementById('detail-api-link').textContent = '{ } /api/' + id;
        const dt = document.getElementById('d-' + id + '-text');
        if (dt) dt.textContent = METRICS[id].detail;
        ['mvrv','sopr','nvt','hodl','cdd','exchange_flow','nupl','rhodl','supply_profit','puell','active_addresses','whale_tx'].forEach(k => document.getElementById('detail-' + k).style.display = k === id ? 'block' : 'none');
        document.querySelectorAll('.metric-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
        if (id === 'mvrv' && data.mvrv)
            cardChart('mvrv-chart-detail', data.mvrv.labels, data.mvrv.values, sigColor(mvrv_signal(data.mvrv.mvrv).cls), false);
        if (id === 'sopr' && data.sopr)
            cardChart('sopr-chart-detail', data.sopr.labels, data.sopr.values, sigColor(sopr_signal(data.sopr.current).cls), false);
        if (id === 'nvt' && data.nvt)
            cardChart('nvt-chart-detail', data.nvt.labels, data.nvt.values, sigColor(nvt_signal(data.nvt.nvt).cls), false);
        if (id === 'hodl' && data.hodl)
            renderHodlChart('hodl-chart-detail', data.hodl.bands, false);
        if (id === 'cdd' && data.cdd)
            cardChart('cdd-chart-detail', data.cdd.labels, data.cdd.values, sigColor(cdd_signal(data.cdd.current, data.cdd.ma90).cls), false);
        if (id === 'nupl' && data.nupl)
            cardChart('nupl-chart-detail', data.nupl.labels, data.nupl.values, sigColor(nupl_signal(data.nupl.nupl).cls), false);
        if (id === 'rhodl' && data.rhodl && data.rhodl.bands_profit)
            renderProfitChart('rhodl-chart-detail', data.rhodl.bands_profit, false);
        if (id === 'supply_profit' && data.supply_profit && data.supply_profit.bands_profit)
            renderProfitChart('supply_profit-chart-detail', data.supply_profit.bands_profit, false);
        if (id === 'puell' && data.puell)
            cardChart('puell-chart-detail', data.puell.labels, data.puell.values, sigColor(puell_signal(data.puell.puell).cls), false);
        if (id === 'active_addresses' && data.active_addresses)
            cardChart('active_addresses-chart-detail', data.active_addresses.labels, data.active_addresses.values, sigColor(active_signal(data.active_addresses.current, data.active_addresses.ma30).cls), false);
        if (id === 'whale_tx' && data.whale_tx)
            cardChart('whale_tx-chart-detail', data.whale_tx.labels, data.whale_tx.values, sigColor(whale_signal(data.whale_tx.current, data.whale_tx.ma30).cls), false);
        if (id === 'exchange_flow' && data.exchange_flow) {
            const d = data.exchange_flow;
            const sig = ef_signal(d.current_net);
            cardChart('exchange_flow-chart-detail', d.labels, d.net, sigColor(sig.cls), false);
            const topEl = document.getElementById('d-exchange_flow-extra');
            if (topEl && d.top_exchanges && d.top_exchanges.length) {
                topEl.innerHTML = '<div style="font-size:0.75rem;color:#888;margin-bottom:0.5rem">Top exchanges (30d)</div>' +
                    d.top_exchanges.map(e =>
                        `<div style="display:flex;justify-content:space-between;font-size:0.78rem;padding:0.2rem 0;border-bottom:1px solid #f5f5f5">
                            <span style="color:#333">${e.exchange}</span>
                            <span><span style="color:#16a34a">↓${fmt_btc(e.inflow)}</span> &nbsp; <span style="color:#dc2626">↑${fmt_btc(e.outflow)}</span></span>
                        </div>`
                    ).join('');
            }
        }
    }

    document.querySelectorAll('.metric-item:not(.soon)').forEach(el => el.addEventListener('click', () => showDetail(el.dataset.id)));
    document.getElementById('btn-back').addEventListener('click', showHome);

    document.getElementById('search').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        document.querySelectorAll('.metric-item').forEach(el => el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none');
        document.querySelectorAll('.group-label').forEach(el => el.style.display = q ? 'none' : '');
    });

    // Sidebar toggle (mobile)
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    document.getElementById('hamburger').addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    document.querySelectorAll('.metric-item:not(.soon)').forEach(el => el.addEventListener('click', () => {
        if (window.innerWidth <= 640) closeSidebar();
    }));
</script>
</body>
</html>
